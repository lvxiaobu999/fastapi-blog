# 单机正式生产 Compose：FastAPI、Nginx、PostgreSQL 和 Redis 均运行在同一台 ECS 的 Docker 中。
# PostgreSQL/Redis 只加入 backend 内部网络，不映射到宿主机公网端口；数据通过宿主机目录持久化。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      # 这些变量只用于首次初始化 PostgreSQL 数据目录。数据库目录已经初始化后，修改密码要
      # 通过 PostgreSQL 管理命令完成，单纯修改环境变量不会自动修改已有账号密码。
      POSTGRES_USER: ${POSTGRES_USER:?请设置 PostgreSQL 应用用户}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 PostgreSQL 密码}
      POSTGRES_DB: ${POSTGRES_DB:?请设置 PostgreSQL 数据库名}
    volumes:
      # 宿主机目录必须位于独立数据盘或已纳入备份，容器删除不会删除该目录。
      - ${PG_DATA_PATH:-/opt/fastapi-blog/data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    environment:
      # Redis 密码由 Compose 专用文件注入；不会把密码写进镜像或仓库 YAML。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 Redis 密码}
    command:
      ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes --appendfsync everysec"]
    volumes:
      # AOF 文件保存 Refresh Session、验证码和 OAuth state；该目录应纳入 ECS 备份。
      - ${REDIS_DATA_PATH:-/opt/fastapi-blog/data/redis}:/data
    healthcheck:
      # REDISCLI_AUTH 避免把密码作为 redis-cli 的命令行参数显示或产生安全警告。
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 阿里云 ECS 若 Docker 构建网络无法解析包索引，可在受控 shell 中传入
      # UV_INDEX_URL=https://mirrors.aliyun.com/pypi/simple；默认不固定地区镜像。
      args:
        UV_INDEX_URL: ${UV_INDEX_URL:-}
    # 发布时用 Git commit/tag 设置 APP_IMAGE_TAG，避免无法判断线上实际运行版本。
    image: fastapi-blog:${APP_IMAGE_TAG:-local}
    env_file:
      - ${APP_ENV_FILE:-/opt/fastapi-blog/config/app.env}
    environment:
      # 数据库和 Redis 凭据只在 compose-prod.env 保存一份；这里在容器创建时生成连接串，
      # 覆盖 app.env 中同名旧值，避免两个文件密码不一致导致 readiness 失败。
      # 生产密码建议只使用字母、数字、点、短横线和下划线，避免 URI 特殊字符需要额外编码。
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      # 用户头像和文章图片写入 app/media；容器重建后仍由 ECS 数据盘保存。
      - ${MEDIA_HOST_PATH:-/opt/fastapi-blog/data/media}:/app/app/media
      # 不要挂载 /opt/fastapi-blog/data/static。app/static 属于发布版本，已在 Dockerfile 的
      # COPY app ./app 阶段写入镜像；额外挂载会覆盖镜像内新 CSS/JS/图片，导致版本不一致。
    restart: unless-stopped
    init: true
    healthcheck:
      # 使用 Python 标准库检查应用入口，避免为健康检查额外安装 curl/wget。
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import json, os, urllib.request; host=json.loads(os.environ['ALLOWED_HOSTS'])[0]; request=urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': host}); urllib.request.urlopen(request, timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

  nginx:
    image: nginx:1.28-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      # 官方 Nginx 镜像启动时会把该值替换进 /etc/nginx/templates 下的模板。
      # 使用必填插值，避免域名漏配时生成错误的 server_name 或 HTTPS 跳转地址。
      APP_DOMAIN: ${APP_DOMAIN:?请设置正式域名，例如 www.sanwan.xyz}
      # 只替换 APP_DOMAIN，保留 $host、$request_uri 等 Nginx 运行时变量。
      NGINX_ENVSUBST_FILTER: ^APP_DOMAIN$
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 目录内必须提供 fullchain.pem 和 privkey.key；私钥不得提交 Git。
      - ${TLS_HOST_PATH:-/opt/fastapi-blog/secrets/tls}:/etc/nginx/tls:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend

networks:
  # 8000 只在内部网络暴露；公网只能通过 Nginx 的 80/443 进入。
  backend:
    driver: bridge
