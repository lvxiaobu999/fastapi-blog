{% extends "layout.html" %}
{% block content %}
<div class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-card-header">
            <span class="eyebrow">Welcome back</span>
            <h1 id="login-title">登录博客</h1>
            <p>登录后管理个人资料；管理员可以发布和维护文章。</p>
        </div>

        {% if error | default(none) %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form class="stacked-form" data-login-form>
            <div class="alert d-none" role="alert" data-form-feedback></div>
            <div>
                <label class="form-label" for="username">用户名或邮箱</label>
                <input class="form-control form-control-lg" id="username" name="username"
                       type="text" autocomplete="username" placeholder="用户名或邮箱" required autofocus
                       value="{{ username | default('') }}">
            </div>
            <div>
                <div class="form-label-row">
                    <label class="form-label" for="password">密码</label>
                    <a href="#password-reset" data-forgot-password>忘记密码？</a>
                </div>
                <input class="form-control form-control-lg" id="password" name="password"
                       type="password" autocomplete="current-password" placeholder="请输入登录密码" required>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit">登录</button>
        </form>

        {% if qq_login_enabled %}
        <div class="third-party-login" aria-label="第三方登录">
            <div class="third-party-divider"><span>其他登录方式</span></div>
            <a class="btn qq-login-button"
               href="{{ url_for('qq_login') }}?next_path={{ request.url.path | urlencode }}"
               data-qq-login>
                <span class="qq-login-mark" aria-hidden="true">Q</span>
                <span>使用 QQ 登录</span>
            </a>
        </div>
        {% endif %}

        <p class="auth-switch">还没有账号？ <a href="{{ url_for('register') }}">创建账号</a></p>
    </section>
</div>
{% endblock content %}
