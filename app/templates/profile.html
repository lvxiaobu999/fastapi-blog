{% extends "layout.html" %}
{% block content %}
<div class="row g-4">
    <aside class="col-lg-4">
        <section class="profile-summary" aria-labelledby="profile-name">
            <label class="profile-avatar-editor" data-avatar-editor>
                <img src="{{ user.image_path }}" alt="{{ user.nickname }}的头像"
                     data-profile-avatar-image>
                <span class="profile-avatar-overlay">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 8h4l2-3h4l2 3h4v11H4V8Z"/>
                        <circle cx="12" cy="13" r="3.5"/>
                    </svg>
                    <span data-avatar-action-text>修改头像</span>
                </span>
                <input class="visually-hidden" name="avatar" type="file"
                       accept="image/png,image/jpeg,image/gif,image/webp"
                       data-avatar-input aria-label="选择新头像">
            </label>
            <p class="profile-avatar-feedback" data-avatar-feedback aria-live="polite"></p>
            <span class="role-badge">{{ "管理员" if user.is_admin else "普通用户" }}</span>
            <h1 id="profile-name">{{ user.nickname }}</h1>
            <p>@{{ user.username }}</p>
            <p class="profile-email">{{ user.email }}</p>
        </section>
    </aside>

    <section class="col-lg-8" aria-labelledby="settings-title">
        <div class="settings-panel">
            <div class="section-heading">
                <div>
                    <span class="eyebrow">Account settings</span>
                    <h2 id="settings-title">个人资料</h2>
                </div>
                <span class="text-muted">用户 ID：{{ user.id }}</span>
            </div>

            {% if message | default(none) %}
            <div class="alert alert-success" role="status">{{ message }}</div>
            {% endif %}

            <form class="stacked-form" data-profile-form data-user-id="{{ user.id }}">
                <div class="alert d-none" role="status" data-form-feedback></div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nickname">昵称</label>
                        <input class="form-control" id="nickname" name="nickname" type="text"
                               maxlength="50" required value="{{ user.nickname }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="username">用户名</label>
                        <input class="form-control profile-readonly-field" id="username" type="text"
                               readonly aria-readonly="true" value="{{ user.username }}">
                        <div class="form-text">用户名是登录标识，不支持自行修改。</div>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="email">邮箱</label>
                        <input class="form-control" id="email" name="email" type="email"
                               maxlength="254" required value="{{ user.email }}">
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">保存修改</button>
                    <button class="btn btn-outline-secondary" type="reset">撤销输入</button>
                </div>
            </form>
        </div>
    </section>
</div>
{% endblock content %}
