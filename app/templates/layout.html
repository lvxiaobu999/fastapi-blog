<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if title %}
            三碗博客 - {{ title }}
        {% else %}
            三碗博客
        {% endif %}
    </title>
    <script src="{{ url_for('static', path='js/bootstrap-state.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', path='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}">
    {% block head %}{% endblock head %}
</head>
<body>
    <nav class="navbar navbar-expand-md blog-navbar" aria-label="主导航">
        <div class="container-xl">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                <span class="brand-mark" aria-hidden="true">F</span>
                <span>三碗博客</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                    aria-expanded="false" aria-label="展开导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="{{ url_for('home') }}">文章</a>
                    </li>
                </ul>
                <div class="navbar-actions">
                    <button class="btn navbar-search-trigger" type="button"
                            data-bs-toggle="modal" data-bs-target="#searchModal"
                            aria-label="搜索文章">
                        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
                            <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"
                                  fill="none" stroke="currentColor" stroke-width="2"
                                  stroke-linecap="round"/>
                        </svg>
                        <span>搜索</span>
                        <kbd>Ctrl K</kbd>
                    </button>
                    <button class="btn btn-outline-light" type="button" data-auth-guest
                            data-bs-toggle="modal" data-bs-target="#loginModal">登录</button>
                    <button class="btn btn-light" type="button" data-auth-guest
                            data-bs-toggle="modal" data-bs-target="#registerModal">注册</button>
                    <button class="theme-toggle-button theme-toggle-on-nav" type="button"
                            data-theme-toggle title="切换到深色主题" aria-label="切换到深色主题">
                        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20.4 15.2A8.5 8.5 0 0 1 8.8 3.6 8.6 8.6 0 1 0 20.4 15.2Z"/>
                        </svg>
                        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="3.5"/>
                            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>
                        </svg>
                    </button>
                    <div class="dropdown user-menu d-none" data-auth-user>
                        <button class="user-avatar-trigger" type="button" data-bs-toggle="dropdown"
                                aria-expanded="false" aria-label="打开用户菜单">
                            <img src="/static/images/default.jpg" alt="" data-current-user-avatar>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end user-popover">
                            <div class="user-popover-header">
                                <img src="/static/images/default.jpg" alt="" data-current-user-avatar>
                                <div><strong data-current-user-nickname>用户</strong>
                                    <span data-current-user-handle>@user</span></div>
                            </div>
                            <nav class="user-activity-shortcuts" aria-label="我的内容">
                                <a href="{{ url_for('my_activities') }}?tab=comments">评论</a>
                                <a href="{{ url_for('my_activities') }}?tab=likes">赞过</a>
                                <a href="{{ url_for('my_activities') }}?tab=favorites">收藏</a>
                            </nav>
                            <div class="user-popover-actions">
                                <a class="user-popover-link d-none" href="{{ url_for('post_create') }}"
                                   data-auth-admin>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                                    <span>发布新帖子</span>
                                </a>
                                <a class="user-popover-link" href="#" data-profile-link>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l11-11-4-4L4 16v4Zm9-13 4 4"/></svg>
                                    <span>编辑个人信息</span>
                                </a>
                                <a class="user-popover-link" href="{{ url_for('my_activities') }}?tab=views">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <span>我的足迹</span>
                                </a>
                                <a class="user-popover-link d-none" href="{{ url_for('admin_dashboard') }}" data-auth-admin>
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-5 8 5v12H4Zm5 0v-6h6v6"/></svg>
                                    <span>进入我的后台</span>
                                </a>
                                <button class="user-popover-link" type="button" data-bs-toggle="modal"
                                        data-bs-target="#passwordModal">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
                                    <span>修改密码</span>
                                </button>
                            </div>
                            <button class="user-popover-logout" type="button" data-logout>退出登录</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-xl page-content">
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="site-footer">
        <div class="container-xl">
            <span>三碗博客</span>
            <span>记录技术，也记录思考。</span>
        </div>
    </footer>

    <div class="modal fade search-modal" id="searchModal" tabindex="-1"
         aria-labelledby="searchModalTitle" aria-hidden="true" data-search-modal>
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header search-modal-header">
                    <div>
                        <span class="eyebrow">SEARCH</span>
                        <h2 class="modal-title fs-5" id="searchModalTitle">搜索文章</h2>
                    </div>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭搜索"></button>
                </div>
                <div class="modal-body search-modal-body">
                    <div class="search-input-wrap">
                        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                            <path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"
                                  fill="none" stroke="currentColor" stroke-width="2"
                                  stroke-linecap="round"/>
                        </svg>
                        <label class="visually-hidden" for="site-search-keyword">按标题搜索文章</label>
                        <input class="form-control" id="site-search-keyword" type="search"
                               maxlength="100" autocomplete="off"
                               placeholder="输入文章标题…" data-site-search>
                    </div>
                    <p class="search-status" aria-live="polite" data-search-status>
                        输入关键词开始搜索
                    </p>
                    <div class="search-results" data-search-results></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5" id="loginModalTitle">登录博客</h2>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <form class="modal-body stacked-form" data-login-form>
                <div class="alert d-none" role="alert" data-form-feedback></div>
                <div><label class="form-label" for="modal-login-username">用户名或邮箱</label>
                    <input class="form-control" id="modal-login-username" name="username"
                           autocomplete="username" placeholder="用户名或邮箱" required></div>
                <div><label class="form-label" for="modal-login-password">密码</label>
                    <input class="form-control" id="modal-login-password" name="password" type="password"
                           autocomplete="current-password" placeholder="请输入登录密码" required></div>
                <div class="form-label-row"><span></span><a href="#password-reset" data-forgot-password>忘记密码？</a></div>
                <button class="btn btn-primary" type="submit">登录</button>
            </form>
        </div></div>
    </div>

    <div class="modal fade" id="passwordResetModal" tabindex="-1"
         aria-labelledby="passwordResetModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5" id="passwordResetModalTitle">找回密码</h2>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <form class="modal-body stacked-form" data-password-reset-form>
                <div class="alert d-none" role="alert" data-form-feedback></div>
                <div><label class="form-label" for="password-reset-email">注册邮箱</label>
                    <input class="form-control" id="password-reset-email" name="email" type="email"
                           maxlength="254" autocomplete="email" placeholder="请输入注册邮箱" required></div>
                <div class="form-actions">
                    <label class="form-label mb-0" for="password-reset-code">验证码</label>
                    <button class="btn verification-code-button" type="button" data-request-reset-code>发送验证码</button>
                </div>
                <input class="form-control" id="password-reset-code" name="code" inputmode="numeric"
                       pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code"
                       placeholder="请输入邮件中的 6 位验证码" required>
                <div><label class="form-label" for="password-reset-new-password">新密码</label>
                    <input class="form-control" id="password-reset-new-password" name="new_password"
                           type="password" minlength="8" maxlength="128" autocomplete="new-password"
                           placeholder="请输入新密码（至少 8 个字符）" required></div>
                <div><label class="form-label" for="password-reset-confirm-password">确认新密码</label>
                    <input class="form-control" id="password-reset-confirm-password" name="confirm_password"
                           type="password" minlength="8" maxlength="128" autocomplete="new-password"
                           placeholder="请再次输入新密码" required></div>
                <button class="btn btn-primary" type="submit">重置密码</button>
            </form>
        </div></div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5" id="registerModalTitle">创建账号</h2>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <form class="modal-body stacked-form" data-register-form>
                <div class="alert d-none" role="alert" data-form-feedback></div>
                <div><label class="form-label" for="modal-register-username">用户名</label>
                    <input class="form-control" id="modal-register-username" name="username" maxlength="50"
                           autocomplete="username" placeholder="请输入用户名" required></div>
                <div><label class="form-label" for="modal-register-email">邮箱</label>
                    <input class="form-control" id="modal-register-email" name="email" type="email" maxlength="254"
                           autocomplete="email" placeholder="请输入常用邮箱" required></div>
                <div><label class="form-label" for="modal-register-password">密码</label>
                    <input class="form-control" id="modal-register-password" name="password" type="password"
                           minlength="8" maxlength="128" autocomplete="new-password"
                           placeholder="请输入密码（至少 8 个字符）" required></div>
                <div><label class="form-label" for="modal-register-confirm">确认密码</label>
                    <input class="form-control" id="modal-register-confirm" name="password_confirm" type="password"
                           minlength="8" maxlength="128" autocomplete="new-password"
                           placeholder="请再次输入密码" required></div>
                <button class="btn btn-primary" type="submit">注册账号</button>
            </form>
        </div></div>
    </div>

    <div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
            <div class="modal-header"><h2 class="modal-title fs-5" id="passwordModalTitle">修改密码</h2>
                <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="关闭"></button></div>
            <form class="modal-body stacked-form" data-password-form>
                <div class="alert d-none" role="alert" data-form-feedback></div>
                <div><label class="form-label" for="current-password">当前密码</label>
                    <input class="form-control" id="current-password" name="current_password"
                           type="password" autocomplete="current-password" placeholder="请输入当前密码" required></div>
                <div><label class="form-label" for="new-password">新密码</label>
                    <input class="form-control" id="new-password" name="new_password" type="password"
                           minlength="8" maxlength="128" autocomplete="new-password"
                           placeholder="请输入新密码（至少 8 个字符）" required></div>
                <div><label class="form-label" for="confirm-password">确认新密码</label>
                    <input class="form-control" id="confirm-password" name="confirm_password" type="password"
                           minlength="8" maxlength="128" autocomplete="new-password"
                           placeholder="请再次输入新密码" required></div>
                <button class="btn btn-primary" type="submit">确认修改</button>
            </form>
        </div></div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="appToastContainer"
         aria-live="polite" aria-atomic="true">
        <div id="appToast" class="toast" role="status" aria-live="polite" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" data-toast-title>三碗博客</strong>
                <button class="btn-close" type="button" data-bs-dismiss="toast" aria-label="关闭"></button>
            </div>
            <div class="toast-body" data-toast-message></div>
        </div>
    </div>

    <script src="{{ url_for('static', path='js/jquery-4.0.0.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/auth.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/search.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/posts.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/post-activities.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='js/forms.js') }}"></script>
    {% block scripts %}{% endblock scripts %}
</body>
</html>
